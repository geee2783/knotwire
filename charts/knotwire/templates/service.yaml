apiVersion: v1
kind: Service
metadata:
  name: knotwire-api
  labels:
    app.kubernetes.io/name: knotwire
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: knotwire
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
